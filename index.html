<h2 id="%E6%B3%95%E6%B2%BB%E6%95%99%E8%82%B2%E8%B5%B0%E9%80%B2%E7%9F%AF%E6%AD%A3%E6%A9%9F%E9%97%9C%E8%A8%88%E7%95%AB">法治教育走進矯正機關計畫</h2>

<footer>共同推動｜<br />民間司法改革基金會<br />Chubb 美商安達產物保險股份有限公司</footer>

<h1 id="%E6%B3%95%E6%B2%BB%E6%95%99%E8%82%B2%E8%B5%B0%E9%80%B2%E7%9F%AF%E6%AD%A3%E6%A9%9F%E9%97%9C%E8%A8%88%E7%95%AB-1">法治教育走進矯正機關計畫</h1>
<p><img class="emoji" draggable="false" alt="🏛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3db.svg" data-marp-twemoji=""/> 共同推動｜民間司法改革基金會 × Chubb 美商安達產物保險股份有限公司</p>
<h4 id="%E8%A8%88%E7%95%AB%E7%B7%A3%E8%B5%B7">計畫緣起</h4>
<ul>
<li>求職、金融交易或熟人請託等日常情境，都可能遇到需要停下來查證的風險。</li>
<li>本計畫將法治教育帶進矯正機關，提供貼近日常、容易理解的法律資訊，協助學員辨識風險、理解法律責任，並做出知情、自主的選擇。</li>
</ul>
<h4 id="%E8%A8%88%E7%95%AB%E7%9B%AE%E6%A8%99">計畫目標</h4>
<ol>
<li>辨識風險：察覺詐騙手法與危險邀約，知道何時應先停下來查證。</li>
<li>理解責任：了解帳戶交付、詐欺與洗錢的法律界線及可能後果。</li>
<li>善用資源：知道遇到困難時，可向哪些正式法律與生活協助管道求助。</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-class="section" data-theme="4xndrpd5e9tqsc353sgd2qpqqdgpzhr4m6eu6enerxr" lang="C" class="section" data-marpit-pagination="3" style="--paginate:true;--class:section;--theme:4xndrpd5e9tqsc353sgd2qpqqdgpzhr4m6eu6enerxr;" data-marpit-pagination-total="49">
<h2 id="1%EF%B8%8F%E2%83%A3-%E5%89%8D%E3%83%BB%E8%BE%A8%E8%AD%98%E9%A2%A8%E9%9A%AA"><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/31-20e3.svg" data-marp-twemoji=""/> 前・辨識風險</h2>
<p>察覺詐騙手法與危險邀約，知道何時應先停下來查證。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="4xndrpd5e9tqsc353sgd2qpqqdgpzhr4m6eu6enerxr" lang="C" data-marpit-pagination="4" style="--paginate:true;--theme:4xndrpd5e9tqsc353sgd2qpqqdgpzhr4m6eu6enerxr;" data-marpit-pagination-total="49">
<h1 id="%E6%B1%82%E8%81%B7%E9%99%B7%E9%98%B1%E5%A4%9A%E5%93%A1%E6%9E%97%E8%AD%A6%E6%88%90%E5%8A%9F%E6%94%94%E9%98%BB%E6%B1%82%E8%81%B7%E8%A9%90%E9%A8%99"><a href="https://www.chcg.gov.tw/ch2/newsdetail.aspx?bull_id=410225">求職陷阱多員林警成功攔阻求職詐騙！</a></h1>
<p>彰化縣政府 2025.05</p>
<p>員林分局員林派出所警員...接獲台新銀行員林分行行員通報有民眾欲辦理開戶，疑似遭詐騙，經員警到場了解，係葉男於網路UG上點選<mark>求職廣告</mark>，進而遭詐欺集團以完成任務可申請補助金為由，要求葉民需到台新<mark>銀行開戶</mark>並提供該帳戶給詐欺集團，員警告知葉男此為詐欺集團常見騙取民眾帳戶手法，經溝通後，成功阻止葉男開立帳戶。</p>
<p>詐騙集團利用求職廣告活動透過網路、社群平台及假求職網站散布不實職缺資訊，誘使民眾上當，且受害者年齡層多為社會新鮮人與待業青年，損失金額從數千元至數萬元不等。詐騙手法包括：要求支付保證金、制服費、系統操作費等不合理費用，或是利用假面試套取個資與帳戶資料，甚至引誘民眾從事非法工作，如洗錢或人頭帳戶操作。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="4xndrpd5e9tqsc353sgd2qpqqdgpzhr4m6eu6enerxr" lang="C" data-marpit-pagination="5" style="--paginate:true;--theme:4xndrpd5e9tqsc353sgd2qpqqdgpzhr4m6eu6enerxr;" data-marpit-pagination-total="49">
<h1 id="%E6%8E%A5%E7%8D%B2%E6%88%B6%E6%94%BF%E5%96%AE%E4%BD%8D%E9%80%9A%E7%9F%A5%E8%BA%AB%E5%88%86%E8%A2%AB%E5%86%92%E7%94%A8%E6%80%8E%E9%BA%BC%E8%BE%A6%E7%95%B6%E5%BF%83%E6%98%AF%E8%A9%90%E9%A8%99"><a href="https://kcpd-cic.kcg.gov.tw/News_Content.aspx?n=2A7C8356AC2CC8AE&amp;sms=19F0C04900775BA9&amp;s=44CB2987B7E77A06">接獲戶政單位通知身分被冒用怎麼辦？當心是詐騙！</a></h1>
<p>高雄市政府警察局 2024.02</p>
<p>日前陳小姐接獲自稱<mark>戶政事務所人員</mark>來電，告知有民眾要申請她的戶籍謄本，詢問是否有委託他人來辦理，林女表示沒有，戶政事務所人員告知其身分被盜用並協助報警，後續將電話轉給假冒<mark>警察</mark>、<mark>檢察官</mark>來電誆稱林女的帳戶涉及賭品案遭通緝，要求交付名下帳戶涉及不法之贓款領出交給檢方監管，並會派員前去拿取，陳女交付款項後有所疑惑，至派出所洽詢，始知遭詐騙。</p>
<p>此類為「假冒公務機構」常見詐騙手法，近期詐騙集團冒用戶政事務所、健保局等名義致電向民眾詐騙個人資料，再以假冒警察或檢察官來電說其帳戶涉及偵辦中的刑案，要求交付名下所有帳戶監管，或要求至金融機構領取積蓄、解除定存，再派出假冒書記官的車手前往指定地點收取提款卡、現金等或要求匯款至指定帳戶，利用民眾擔心涉及刑事案件之緊張、恐慌情緒，假借檢警常用話術的方式來詐騙民眾。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="4xndrpd5e9tqsc353sgd2qpqqdgpzhr4m6eu6enerxr" lang="C" data-marpit-pagination="6" style="--paginate:true;--theme:4xndrpd5e9tqsc353sgd2qpqqdgpzhr4m6eu6enerxr;" data-marpit-pagination-total="49">
<h1 id="%E5%81%87%E5%86%92%E8%A6%AA%E5%8F%8B%E6%80%A5%E9%9C%80%E7%94%A8%E9%8C%A2-%E6%BD%AE%E8%AD%A6%E8%AD%98%E7%A0%B4%E8%A9%90%E9%A8%99%E6%89%8B%E6%B3%95%E5%8F%8A%E6%99%82%E9%98%BB%E8%A9%90%E6%88%90%E5%8A%9F"><a href="https://www.pthg.gov.tw/chaozhou/News_Content.aspx?n=625E2F8A338E6751&amp;sms=AF710C0DA2CA2C33&amp;s=80C9BD98BEAC507A">假冒親友急需用錢　潮警識破詐騙手法及時阻詐成功</a></h1>
<p>嘉義縣政府警察局 2024.09</p>
<p>潮州分局竹田分駐所所長...、警員...日前擔服10-12時巡邏勤務，接獲西勢郵局行員通報，稱有民眾疑遭詐騙，警方到場後中年男子向警方表示，近日他於<mark>LINE通訊軟體</mark>上接到稱是她女兒的訊息及佯稱近日剛更換電話號碼，其<mark>自稱他女兒的人表示現在急需用錢</mark>，需要付貨款金額82萬元，並分成42萬元及40萬元匯款，<mark>若不付款恐有違約等相關法律責任</mark>，中年男子情急之下，不疑有他，認為真的是女兒急需用錢，並依詐騙集團所提供之帳戶欲匯款。經盧等2員仔細查證該帳戶及LINE對話訊息，並耐心勸說，播放先前遭同樣詐騙手法的新聞供其觀看，耐心解釋這為典型的詐騙手法「假冒親友-猜猜我是誰」，中年男子終於卸下心房，警方協助致電給中年男子女兒原始號碼，讓其與女兒對話，最後證實為詐騙訊息，事後中年男子萬分感謝郵局行員及警方，避免渠成為詐騙集團的待宰羔羊。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="4xndrpd5e9tqsc353sgd2qpqqdgpzhr4m6eu6enerxr" lang="C" data-marpit-pagination="7" style="--paginate:true;--theme:4xndrpd5e9tqsc353sgd2qpqqdgpzhr4m6eu6enerxr;" data-marpit-pagination-total="49">
<h1 id="%E6%84%9B%E6%83%85%E9%99%B7%E9%98%B1%E5%81%87%E4%BA%A4%E5%8F%8B%E8%A9%90%E9%A8%99%E6%A9%AB%E8%A1%8C-%E7%94%9C%E8%A8%80%E8%9C%9C%E8%AA%9E%E8%83%8C%E5%BE%8C%E8%97%8F%E5%8D%B1%E6%A9%9F"><a href="https://police.npa.gov.tw/ch/app/data/view?module=wg081&amp;id=1835&amp;serno=0e226547-a730-4fb2-95b0-613e77746b82">愛情陷阱！假交友詐騙橫行　甜言蜜語背後藏危機</a></h1>
<p>內政部警政署 2025.05</p>
<p>警方表示，詐騙集團會<mark>偽裝成帥氣男子或漂亮女性</mark>，並以「軍人」、「醫生」、「金融專業人士」等身分與被害人互動，過程中不斷關心對方、稱呼親密，很快就<mark>發展成「網戀關係」</mark>。在建立信任後，便開始鼓吹各種投資機會，...被害人在<mark>初期投入小額資金</mark>後，往往會看到帳戶顯示「穩定獲利」，因而深信不疑，<mark>逐步投入更大金額</mark>，當欲提領資金或帳戶出現異常時，對方卻以各種理由<mark>拖延、消失</mark>，甚至直接封鎖聯絡方式，才驚覺遭詐。</p>
<p>假交友詐騙的5大特徵：</p>
<ol>
<li>來路不明的好友邀請</li>
<li>甜言蜜語、快速建立信任</li>
<li>聊到投資或金錢話題</li>
<li>初期讓你小賺，誘導投入更多</li>
<li>不肯視訊、不願意見面</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="4xndrpd5e9tqsc353sgd2qpqqdgpzhr4m6eu6enerxr" lang="C" data-marpit-pagination="8" style="--paginate:true;--theme:4xndrpd5e9tqsc353sgd2qpqqdgpzhr4m6eu6enerxr;" data-marpit-pagination-total="49">
<h1 id="%E7%A4%BE%E4%BA%A4%E5%B7%A5%E7%A8%8B%E5%88%A9%E7%94%A8%E4%BF%A1%E4%BB%BB%E6%93%8A%E6%BD%B0%E8%87%BA%E7%81%A3%E8%B3%87%E5%AE%89%E9%98%B2%E7%B7%9A"><a href="https://www.ithome.com.tw/news/171984">社交工程利用信任，擊潰臺灣資安防線</a></h1>
<p>iThome 2025.10</p>
<p>社交工程的本質，從來都不是對設備發動技術上的攻擊，而是針對使用者的「信任」發動心理戰術。誠如數發部資安署主任李昱緯所言，社交工程是一場徹頭徹尾的心理戰，駭客正是利用人性中最基本的三個弱點——<mark>對目標的「信任」、對事件的「恐懼」，以及對訊息的「好奇心」</mark>——來操控受害者的行為，讓他們自己主動交出金錢、資料，甚至電腦的帳號權限。</p>
<p>...</p>
<p>儘管攻擊技術不斷進化，但數位發展部資安署主任李昱緯指出，社交工程的核心工具始終圍繞在四個主要樣態：<mark>釣魚郵件</mark>、<mark>惡意簡訊</mark>、<mark>偽冒網站</mark>以及<mark>偽冒檔案</mark>；最終目的不外乎<mark>「竊取資料」</mark>、<mark>「騙取金錢」</mark>，或進一步<mark>「控制電腦」</mark>。他進一步解釋，社交工程本身並不是技術上的攻擊，它攻擊的目標不是使用者的設備，而是攻擊使用者的信任，「社交工程的本質就是一場心理戰術。」他說。</p>
</section>

<h1 id="%E9%8F%9F%E5%AD%90%E8%B6%85%E4%BA%BA%E5%85%8D%E8%B2%BB%E9%9B%A8%E9%9E%8B%E5%8D%BB%E8%A6%81%E4%BB%98%E9%81%8B%E8%B2%BB58%E5%85%83-%E9%80%99%E9%80%A3%E7%B5%90%E6%9C%89%E6%AF%92%E6%98%AF%E8%A9%90%E9%A8%99"><a href="https://tw.nextapple.com/local/20251005/54C6DF573E80E7D7DAAA81B4F58A3DEB">鏟子超人免費雨鞋卻要付運費58元　這連結有毒！是詐騙</a></h1>
<p>壹蘋新聞網 2025.10</p>
<p>根據警政署165反詐騙中心公佈的案例，1名準備前往花蓮救災的民眾於9月30日凌晨在Threads社群平台上，看到帳號「hqt441」發布貼文，聲稱要前往花蓮協助救災，並願意<mark>免費提供雨靴，僅需支付運費</mark>。由於該民眾正有前往災區幫忙的打算，便主動私訊聯繫對方。</p>
<p>起初詐騙者態度誠懇友善，該民眾隨後加入對方LINE帳號，暱稱為「陳靜怡」，並於10月2日透過玉山銀行轉帳58元至對方提供的中國信託帳戶。然而，幾小時後，對方以「核對金流」、「製作感謝名冊」等理由，要求該民眾<mark>點選連結進行「實名制認證」</mark>。</p>
<p>當民眾點入連結後發現頁面<mark>要求輸入完整銀行卡號</mark>，立刻警覺這是詐騙陷阱。他表示，如果只是單純寄送物資，根本不需要這些額外程序，只要提供帳號末5碼即可核對身份。於是他立即中斷與對方所有聯繫，並前往警察局報案。</p>
</section>

<h1 id="%E6%83%85%E5%A2%83%E7%B7%B4%E7%BF%92--%E9%87%91%E8%9E%8D%E9%98%B2%E8%A9%90">情境練習 — 金融防詐</h1>
<div class="column">
<h4 id="%F0%9F%A4%94-%E8%AA%AA%E8%A6%81%E9%80%80%E8%B2%BB%E6%88%96%E7%90%86%E8%B3%A0%E7%82%BA%E4%BB%80%E9%BA%BC%E5%85%88%E8%A6%81%E6%88%91%E7%9A%84%E5%AF%86%E7%A2%BC"><img class="emoji" draggable="false" alt="🤔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f914.svg" data-marp-twemoji=""/> 說要退費或理賠，為什麼先要我的密碼？</h4>
<p>有人自稱保險公司客服，說有一筆退費或理賠金可以領取，卻要求先點擊連結、提供簡訊驗證碼，甚至先匯款支付手續費。</p>
</div>
<div class="column">
<h4 id="%F0%9F%92%AD-%E6%83%B3%E4%B8%80%E6%83%B3"><img class="emoji" draggable="false" alt="💭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4ad.svg" data-marp-twemoji=""/> 想一想</h4>
<p>對方說要匯錢給我，為什麼需要我的網銀密碼或驗證碼？</p>
<h4 id="%F0%9F%9A%A8-%E8%AD%A6%E8%A8%8A"><img class="emoji" draggable="false" alt="🚨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a8.svg" data-marp-twemoji=""/> 警訊</h4>
<p>先付錢才能領款、索取帳密或驗證碼，還催促立即操作。</p>
<h4 id="%E2%AC%87%EF%B8%8F-%E9%80%99%E6%99%82%E5%8F%AF%E4%BB%A5"><img class="emoji" draggable="false" alt="⬇️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2b07.svg" data-marp-twemoji=""/> 這時可以</h4>
<p>先停止操作，從保險公司官方管道查證；有疑慮撥165，若已提供敏感資料，應立即聯繫銀行等相關業者。</p>
</div>
</section>

<p>哪些行為可能構成犯罪？</p>

<li data-marpit-fragment="1"><img class="emoji" draggable="false" alt="🪪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1faaa.svg" data-marp-twemoji=""/> 撿到身分證後放在家中兩週，期間用撿到身分證的影本申請貸款</li>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-marpit-fragments="4" data-paginate="true" data-footer="[你是誰！很重要！（冒用身分證之十大問題）](https://www.tph.moj.gov.tw/4421/4475/632364/1344503/post)" data-theme="4xndrpd5e9tqsc353sgd2qpqqdgpzhr4m6eu6enerxr" lang="C" data-marpit-pagination="17" style="--paginate:true;--footer:[你是誰！很重要！（冒用身分證之十大問題）](https://www.tph.moj.gov.tw/4421/4475/632364/1344503/post);--theme:4xndrpd5e9tqsc353sgd2qpqqdgpzhr4m6eu6enerxr;" data-marpit-pagination-total="49">
<h1 id="%E5%93%AA%E4%BA%9B%E8%A1%8C%E7%82%BA%E5%8F%AF%E8%83%BD%E6%A7%8B%E6%88%90%E7%8A%AF%E7%BD%AA--%E6%92%BF%E5%88%B0%E8%BA%AB%E5%88%86%E8%AD%89%E6%9C%AA%E5%8D%B3%E6%99%82%E6%AD%B8%E9%82%84">哪些行為可能構成犯罪？ — 撿到身分證未即時歸還</h1>
<p><img class="emoji" draggable="false" alt="🪪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1faaa.svg" data-marp-twemoji=""/> 撿到身分證後放在家中兩週，期間用撿到身分證的影本申請貸款</p>
<ul>
<li data-marpit-fragment="1">民眾常誤以為拾得身分證可以先保留，但未即時送交警局，已可能觸犯侵占遺失物罪；若進一步使用，甚至構成偽造文書或冒名頂替。</li>
<li data-marpit-fragment="2">[例] 某民眾撿到身分證後放在家中兩週未處理，警方調閱監視器追查失主遭冒用情況時，該民眾因遲未歸還遭依刑法侵占遺失物函送檢方，且須出庭說明。</li>
<li data-marpit-fragment="3">影本同樣具有代表性，不可任意挪用。若將影本拿去申貸、開戶或其他未經同意用途，即屬偽造文書與違反個人資料保護法。</li>
<li data-marpit-fragment="4">[例] 租屋仲介保留房客身分證影本，後擅自將影本提供給貸款代辦使用。借款責任落到房客身上，該房客遭銀行追討近百萬債務，報案後才查出影本遭非法使用，仲介與代辦均遭起訴。</li>
</ul>
<footer><a href="https://www.tph.moj.gov.tw/4421/4475/632364/1344503/post">你是誰！很重要！（冒用身分證之十大問題）</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-marpit-fragments="2" data-paginate="true" data-footer="[你是誰！很重要！（冒用身分證之十大問題）](https://www.tph.moj.gov.tw/4421/4475/632364/1344503/post)" data-theme="4xndrpd5e9tqsc353sgd2qpqqdgpzhr4m6eu6enerxr" lang="C" data-marpit-pagination="18" style="--paginate:true;--footer:[你是誰！很重要！（冒用身分證之十大問題）](https://www.tph.moj.gov.tw/4421/4475/632364/1344503/post);--theme:4xndrpd5e9tqsc353sgd2qpqqdgpzhr4m6eu6enerxr;" data-marpit-pagination-total="49">
<h1 id="%E5%93%AA%E4%BA%9B%E8%A1%8C%E7%82%BA%E5%8F%AF%E8%83%BD%E6%A7%8B%E6%88%90%E7%8A%AF%E7%BD%AA--%E5%B9%AB%E4%BB%96%E4%BA%BA%E7%BA%8C%E7%B4%84%E9%9B%BB%E4%BF%A1%E9%96%80%E8%99%9F">哪些行為可能構成犯罪？ — 幫他人續約電信門號</h1>
<p><img class="emoji" draggable="false" alt="📡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4e1.svg" data-marp-twemoji=""/> 好心幫朋友續約電信門號，所以在門市代填個人資料</p>
<ul>
<li data-marpit-fragment="1">電信門市或業務要求客人「代朋友續約、代填資料」，若簽名或填寫身分資料，使文件上表彰為「本人」之意思，即可能構成行使偽造私文書，後續偵查時常被法院或檢警採為不利證據。</li>
<li data-marpit-fragment="2">[例] 某手機門市要求顧客「幫朋友續約」，顧客照做後留下簽名。後因該門號涉及分期詐欺，警方調閱資料、比對簽名，該顧客因「冒名簽署」遭偵辦，需出庭說明。</li>
</ul>
<footer><a href="https://www.tph.moj.gov.tw/4421/4475/632364/1344503/post">你是誰！很重要！（冒用身分證之十大問題）</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-marpit-fragments="4" data-paginate="true" data-footer="[你是誰！很重要！（冒用身分證之十大問題）](https://www.tph.moj.gov.tw/4421/4475/632364/1344503/post)" data-theme="4xndrpd5e9tqsc353sgd2qpqqdgpzhr4m6eu6enerxr" lang="C" data-marpit-pagination="19" style="--paginate:true;--footer:[你是誰！很重要！（冒用身分證之十大問題）](https://www.tph.moj.gov.tw/4421/4475/632364/1344503/post);--theme:4xndrpd5e9tqsc353sgd2qpqqdgpzhr4m6eu6enerxr;" data-marpit-pagination-total="49">
<h1 id="%E5%93%AA%E4%BA%9B%E8%A1%8C%E7%82%BA%E5%8F%AF%E8%83%BD%E6%A7%8B%E6%88%90%E7%8A%AF%E7%BD%AA--%E5%87%BA%E5%80%9F%E8%BA%AB%E5%88%86%E8%AD%89">哪些行為可能構成犯罪？ — 出借身分證</h1>
<p><img class="emoji" draggable="false" alt="🏦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3e6.svg" data-marp-twemoji=""/> 出借身分證給朋友，讓信用不好的朋友可以申請網路銀行帳戶</p>
<ul>
<li data-marpit-fragment="1">民眾常因好意外借身分證協助朋友開戶或申請貸款，卻不知此舉極可能助長人頭帳戶或詐欺金流。一旦詐欺發生，外借者通常難以脫身，往往涉及洗錢防制法、刑法詐欺罪及偽造文書罪。</li>
<li data-marpit-fragment="2">[例] 陳男為朋友「方便」借身分證去辦手機門號，門號後遭詐欺集團作為申請網銀與貸款工具，導致陳男收到地檢署通知並遭列為洗錢案件「共犯」。經多次筆錄與說明才排除犯罪嫌疑，但信用受損多年。</li>
<li data-marpit-fragment="3">詐騙集團常用徵才名義蒐集身分證正反面，作為建立人頭戶的資料來源，被害人常在不知情情況下變成詐欺、洗錢案件的嫌疑人。</li>
<li data-marpit-fragment="4">[例] 黃女應徵「居家打字員」，依指示上傳身分證後即遭冒名辦理五個銀行帳戶。事後警方以監視器比對提出傳喚，經查清後才解除嫌疑。</li>
</ul>
<footer><a href="https://www.tph.moj.gov.tw/4421/4475/632364/1344503/post">你是誰！很重要！（冒用身分證之十大問題）</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-marpit-scope-PtB5Xm64="" data-marpit-fragments="4" data-paginate="true" data-theme="4xndrpd5e9tqsc353sgd2qpqqdgpzhr4m6eu6enerxr" lang="C" data-marpit-pagination="20" style="--paginate:true;--theme:4xndrpd5e9tqsc353sgd2qpqqdgpzhr4m6eu6enerxr;" data-marpit-pagination-total="49">
<h1 id="%E6%B3%95%E5%BE%8B%E7%9F%A5%E8%AD%98%E5%95%8F%E7%AD%94--%E9%80%B2%E9%9A%8E-%F0%9F%8D%82">法律知識問答 — 進階 <img class="emoji" draggable="false" alt="🍂" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f342.svg" data-marp-twemoji=""/></h1>
<p>罰多重：由重到輕排序</p>
<ol>
<li data-marpit-fragment="1">殺人 / 重傷 / 傷害</li>
<li data-marpit-fragment="2">強盜 / 搶奪 / 竊盜 / 侵占</li>
<li data-marpit-fragment="3">電信詐欺 / 詐欺 / 偽造文書</li>
<li data-marpit-fragment="4">洗錢</li>
</ol>
<ul>
<li><img class="emoji" draggable="false" alt="🔦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f526.svg" data-marp-twemoji=""/> 直覺</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-marpit-scope-S2VxvB6E="" data-paginate="true" data-theme="4xndrpd5e9tqsc353sgd2qpqqdgpzhr4m6eu6enerxr" lang="C" data-marpit-pagination="21" style="--paginate:true;--theme:4xndrpd5e9tqsc353sgd2qpqqdgpzhr4m6eu6enerxr;" data-marpit-pagination-total="49">
<h1 id="%E7%94%9F%E5%91%BD%E8%BA%AB%E9%AB%94">生命、身體</h1>
<table>
<thead>
<tr>
<th style="text-align:left">刑法</th>
<th style="text-align:right">罪名</th>
<th style="text-align:left">罰則</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">§271 I</td>
<td style="text-align:right">殺人</td>
<td style="text-align:left">死刑、無期徒刑或10年以上有期徒刑 <small><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/31-20e3.svg" data-marp-twemoji=""/></small></td>
</tr>
<tr>
<td style="text-align:left">§278 I</td>
<td style="text-align:right">重傷</td>
<td style="text-align:left">5年以上12年以下有期徒刑 <small><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/32-20e3.svg" data-marp-twemoji=""/></small></td>
</tr>
<tr>
<td style="text-align:left">§277 I</td>
<td style="text-align:right">傷害</td>
<td style="text-align:left">5年以下有期徒刑、拘役或50萬元以下罰金 <small><img class="emoji" draggable="false" alt="3️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/33-20e3.svg" data-marp-twemoji=""/></small></td>
</tr>
</tbody>
</table>
<ol>
<li>殺人者，處死刑、無期徒刑或10年以上有期徒刑。</li>
<li>使人受重傷者，處5年以上12年以下有期徒刑。</li>
<li>傷害人之身體或健康者，處5年以下有期徒刑、拘役或50萬元以下罰金。</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-marpit-scope-5gyHlxFJ="" data-paginate="true" data-theme="4xndrpd5e9tqsc353sgd2qpqqdgpzhr4m6eu6enerxr" lang="C" data-marpit-pagination="22" style="--paginate:true;--theme:4xndrpd5e9tqsc353sgd2qpqqdgpzhr4m6eu6enerxr;" data-marpit-pagination-total="49">
<h1 id="%E8%87%AA%E7%94%B1%E8%B2%A1%E7%94%A2">自由、財產</h1>
<table>
<thead>
<tr>
<th style="text-align:left">刑法</th>
<th style="text-align:right">罪名</th>
<th style="text-align:left">罰則</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">§325 I</td>
<td style="text-align:right">強盜</td>
<td style="text-align:left">5年以上有期徒刑 <small><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/31-20e3.svg" data-marp-twemoji=""/></small></td>
</tr>
<tr>
<td style="text-align:left">§328 I</td>
<td style="text-align:right">搶奪</td>
<td style="text-align:left">6月以上5年以下有期徒刑 <small><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/32-20e3.svg" data-marp-twemoji=""/></small></td>
</tr>
<tr>
<td style="text-align:left">§320 I</td>
<td style="text-align:right">竊盜</td>
<td style="text-align:left">5年以下有期徒刑、拘役或50萬元以下罰金 <small><img class="emoji" draggable="false" alt="3️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/33-20e3.svg" data-marp-twemoji=""/></small></td>
</tr>
<tr>
<td style="text-align:left">§335 I</td>
<td style="text-align:right">侵占</td>
<td style="text-align:left">5年以下有期徒刑、拘役或科或併科3萬元以下罰金 <small><img class="emoji" draggable="false" alt="4️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/34-20e3.svg" data-marp-twemoji=""/></small></td>
</tr>
</tbody>
</table>
<ol>
<li>意圖為自己或第三人不法之所有，以強暴、脅迫、藥劑、催眠術或他法，至使不能抗拒，而取他人之物或使其交付者，為強盜罪，處5年以上有期徒刑。</li>
<li>意圖為自己或第三人不法之所有，而搶奪他人之動產者，處6月以上5年以下有期徒刑。</li>
<li>意圖為自己或第三人不法之所有，而竊取他人之動產者，為竊盜罪，處5年以下有期徒刑、拘役或50萬元以下罰金。</li>
<li>意圖為自己或第三人不法之所有，而侵占自己持有他人之物者，處5年以下有期徒刑、拘役或科或併科3萬元以下罰金。</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-class="column-layout" data-footer="[假交友感情詐騙誘投資假商城 36人遭詐2148萬元](https://www.cna.com.tw/news/asoc/202607070238.aspx)" data-theme="4xndrpd5e9tqsc353sgd2qpqqdgpzhr4m6eu6enerxr" lang="C" class="column-layout" data-marpit-pagination="23" style="--paginate:true;--class:column-layout;--footer:[假交友感情詐騙誘投資假商城 36人遭詐2148萬元](https://www.cna.com.tw/news/asoc/202607070238.aspx);--theme:4xndrpd5e9tqsc353sgd2qpqqdgpzhr4m6eu6enerxr;" data-marpit-pagination-total="49">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-marpit-scope-k0EYyvs5="" data-marpit-fragments="1" data-paginate="true" data-footer="[你了解詐騙集團嗎? 詐欺集團的組織分工及求職陷阱](https://www.tpc.moj.gov.tw/292885/976681/661783/1239674/post)" data-theme="4xndrpd5e9tqsc353sgd2qpqqdgpzhr4m6eu6enerxr" lang="C" data-marpit-pagination="25" style="--paginate:true;--footer:[你了解詐騙集團嗎? 詐欺集團的組織分工及求職陷阱](https://www.tpc.moj.gov.tw/292885/976681/661783/1239674/post);--theme:4xndrpd5e9tqsc353sgd2qpqqdgpzhr4m6eu6enerxr;" data-marpit-pagination-total="49">
<h1 id="%E8%A9%90%E6%AC%BA%E9%9B%86%E5%9C%98%E7%B5%84%E7%B9%94%E7%B0%A1%E4%BB%8B-%F0%9F%AA%A2">詐欺集團組織簡介 <img class="emoji" draggable="false" alt="🪢" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1faa2.svg" data-marp-twemoji=""/></h1>
<table>
<thead>
<tr>
<th style="text-align:right">角色</th>
<th style="text-align:left">說明</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:right">首腦</td>
<td style="text-align:left">整個集團的領導者，負責詐騙工作的策劃及分工</td>
</tr>
<tr>
<td style="text-align:right">行騙者</td>
<td style="text-align:left">機房成員，實際與被害人互動並騙取匯款，方式可能包含電話/簡訊/通訊軟體等</td>
</tr>
<tr>
<td style="text-align:right">取簿手</td>
<td style="text-align:left">收受人頭帳戶，方式可能包含前往超商、置物櫃等</td>
</tr>
<tr>
<td style="text-align:right">車手</td>
<td style="text-align:left">將贓款提領出來，或是向被害人面交詐欺贓款</td>
</tr>
<tr>
<td style="text-align:right">監控手</td>
<td style="text-align:left">監控車手領錢狀況</td>
</tr>
<tr>
<td style="text-align:right">收水手</td>
<td style="text-align:left">收受車手提領出的贓款，再把錢交給上手，或透過各管道輾轉將錢交回集團</td>
</tr>
</tbody>
</table>
<ul>
<li data-marpit-fragment="1"><img class="emoji" draggable="false" alt="🔺" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f53a.svg" data-marp-twemoji=""/> 人數分配？</li>
</ul>
